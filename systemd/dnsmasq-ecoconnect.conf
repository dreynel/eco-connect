# Copy to /etc/dnsmasq.d/ecoconnect.conf after changing interface names if needed.
# The router/AP must be in bridge/AP mode with DHCP and NAT disabled.

interface=end0
bind-interfaces
dhcp-range=192.168.8.50,192.168.8.200,255.255.255.0,12h
dhcp-option=3,192.168.8.1
dhcp-option=6,192.168.8.1
dhcp-option=114,http://192.168.8.1:8080/
domain-needed
bogus-priv
server=1.1.1.1
server=8.8.8.8
address=/portal.ecoconnect/192.168.8.1
address=/connectivitycheck.gstatic.com/192.168.8.1
address=/clients3.google.com/192.168.8.1
address=/captive.apple.com/192.168.8.1
address=/www.msftconnecttest.com/192.168.8.1
address=/www.msftncsi.com/192.168.8.1
address=/detectportal.firefox.com/192.168.8.1
